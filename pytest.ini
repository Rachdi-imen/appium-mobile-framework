[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .

addopts =
    -ra
    --strict-markers
    --strict-config
    --alluredir=reports/allure-results
    --clean-alluredir

markers =
    android: test exécuté sur Android (UiAutomator2)
    ios: test exécuté sur iOS (XCUITest)
    smoke: parcours rapide de vérification
    e2e: parcours bout en bout
    gestures: tests basés sur les actions W3C
    data_driven: tests paramétrés

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

filterwarnings =
    error::DeprecationWarning:appium.*
    ignore::DeprecationWarning:allure_commons.*